services:
  # --- BANCO DE DADOS ÚNICO ---
  postgres:
    image: postgres:15-alpine
    container_name: shared-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      # Este arquivo será lido AUTOMATICAMENTE na primeira vez que o banco subir
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shared-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: shared-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MICROSSERVIÇOS ---
  catalog-service:
    build: ./backend/catalog-service
    container_name: catalog-service
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_NAME=catalog_db
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production

  inventory-service:
    build: ./backend/inventory-service
    container_name: inventory-service
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3002
      - DB_HOST=postgres
      - DB_NAME=inventory_db
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production

  order-service:
    build: ./backend/order-service
    container_name: order-service
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3003
      - DB_HOST=postgres
      - DB_NAME=order_db
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production

  payment-service:
    build: ./backend/payment-service
    container_name: payment-service
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3004
      - DB_HOST=postgres
      - DB_NAME=payment_db
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production

  user-service:
    build: ./backend/user-service
    container_name: user-service
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3005
      - DB_HOST=postgres
      - DB_NAME=user_db
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production

  # --- API GATEWAY ---
  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
      - user-service
    environment:
      - PORT=3000
      - CATALOG_URL=http://catalog-service:3001
      - INVENTORY_URL=http://inventory-service:3002
      - ORDER_URL=http://order-service:3003
      - PAYMENT_URL=http://payment-service:3004
      - USER_URL=http://user-service:3005
      - JWT_SECRET=seu-secret-super-seguro-mudar-em-producao
      - NODE_ENV=production
