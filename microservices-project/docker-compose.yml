      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: order_db
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U admin -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:15-alpine
