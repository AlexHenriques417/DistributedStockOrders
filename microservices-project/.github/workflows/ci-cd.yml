name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  DOCKER_BUILDKIT: 1
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - catalog-service
          - inventory-service
          - order-service
          - payment-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend/${{ matrix.service }}
        run: npx prisma generate || true

      - name: Run linter
        working-directory: backend/${{ matrix.service }}
        run: npm run lint

      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: npm run test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Run linter
        working-directory: frontend/web-app
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/web-app
        run: npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - catalog-service
          - inventory-service
          - order-service
          - payment-service

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/microservice-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/microservice-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy
        run: echo "Deploy step (k8s / helm / etc)"