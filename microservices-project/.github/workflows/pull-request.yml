name: Pull Request Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      user-service: ${{ steps.changes.outputs.user-service }}
      catalog-service: ${{ steps.changes.outputs.catalog-service }}
      inventory-service: ${{ steps.changes.outputs.inventory-service }}
      order-service: ${{ steps.changes.outputs.order-service }}
      payment-service: ${{ steps.changes.outputs.payment-service }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changes
        run: |
          changes=$(git diff --name-only origin/main...HEAD)

          check() {
            if echo "$changes" | grep -q "$1"; then
              echo "$2=true" >> $GITHUB_OUTPUT
            else
              echo "$2=false" >> $GITHUB_OUTPUT
            fi
          }

          check backend/api-gateway api-gateway
          check backend/user-service user-service
          check backend/catalog-service catalog-service
          check backend/inventory-service inventory-service
          check backend/order-service order-service
          check backend/payment-service payment-service
          check frontend frontend

  test-catalog-service:
    needs: analyze
    if: needs.analyze.outputs.catalog-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd backend/catalog-service
          npm ci
          npx prisma generate || true
          npm run lint
          npm test

  test-frontend:
    needs: analyze
    if: needs.analyze.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd frontend/web-app
          npm ci
          npm run lint
          npm run build