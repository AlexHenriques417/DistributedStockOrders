# RabbitMQ Configuration for Microservices

# Memory and Disk
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

# Management
management.load_definitions = /etc/rabbitmq/definitions.json
management.tcp.port = 15672

# Default User (will be overridden by definitions)
default_user = admin
default_pass = rabbitmq_pass_123

# Policies
policy.default.vhost = /

# Logging
log.console.level = info
log.file.level = info

# Queue and Exchange Settings
queue_master_locator = balanced

# Message TTL (default 7 days)
message_ttl = 604800000

# Dead Letter Exchange
dead_letter_exchange = dlx

# Prefetch
consumer_timeout = 1800000

# Retention
retention_policy = standard

# Security
auth_backends.1 = rabbit_auth_backend_internal
auth_backends.2 = rabbit_auth_backend_ldap

# Plugin list
enabled_plugins = [rabbitmq_management, rabbitmq_web_stomp, rabbitmq_stomp, rabbitmq_prometheus]
